<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pembayaran Ringgit-Tap</title>
    <link rel="stylesheet" href="style.css">
    <style>
        #reader { width: 100%; border-radius: 15px; overflow: hidden; border: 2px solid #4A3728; }
        .payment-box { background: white; padding: 20px; border-radius: 15px; margin-top: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .confirm-btn { background: #4CAF50; color: white; border: none; padding: 15px; width: 100%; border-radius: 10px; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="terminal-container">
    <div class="header">
        <span class="logo">📱</span>
        <h1>Imbas Bayaran</h1>
    </div>

    <!-- Scanner Kamera -->
    <div id="reader"></div>

    <!-- Paparan Hasil Scan (Akan muncul selepas scan berjaya) -->
    <div id="payment-details" class="payment-box" style="display: none;">
        <h3>Pengesahan Bayaran</h3>
        <p><strong>Penerima:</strong> <br><span id="vendor-addr" style="font-size: 0.8em; color: #666;"></span></p>
        <p><strong>Jumlah:</strong> <br><span id="amount-lum" style="font-size: 1.5em; color: #4A3728;"></span> LUM</p>
        <hr>
        <button class="confirm-btn" onclick="processPayment()">HANTAR BAYARAN</button>
    </div>
</div>

<!-- URUTAN SKRIP -->
<script src="html5-qrcode.min.js"></script>
<script src="config.js"></script>
<script>
    const html5QrCode = new Html5Qrcode("reader");

    const qrConfig = { fps: 10, qrbox: { width: 250, height: 250 } };

    html5QrCode.start({ facingMode: "environment" }, qrConfig, (decodedText) => {
        // Logik membaca protokol lum:
        if (decodedText.startsWith("lum:")) {
            html5QrCode.stop(); // Berhenti kamera
            parseAndShow(decodedText);
        }
    });

    function parseAndShow(data) {
        // Contoh data: lum:wallet?amount=170000
        const urlParams = new URLSearchParams(data.split('?')[1]);
        const wallet = data.split(':')[1].split('?')[0];
        const amount = urlParams.get('amount');

        document.getElementById('vendor-addr').innerText = wallet;
        document.getElementById('amount-lum').innerText = Number(amount).toLocaleString();
        document.getElementById('payment-details').style.display = "block";
    }

    function processPayment() {
        alert("Transaksi sedang diproses ke Blockchain LUM...");
        // Langkah seterusnya: Integrasi Wallet API
    }
</script>

</body>
</html>
